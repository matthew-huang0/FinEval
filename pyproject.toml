[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fineval"
version = "0.1.0"
description = "A benchmarking tool that evaluates LLMs against classical ML baselines on financial reasoning tasks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Matthew Huang" }
]
dependencies = [
    "openai>=1.40.0",
    "pydantic>=2.5.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "matplotlib>=3.8.0",
    "datasets>=2.18.0",
    "jupyter>=1.0.0",
    "tabulate>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["fineval*"]
